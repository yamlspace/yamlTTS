services:
  tts:
    build: .
    ports:
      - "5002:5002"
    volumes:
      - ./models:/root/.local/share/tts/tts_models
    command: >
      /app/.venv/bin/python -m TTS.server.server 
      --model_path /root/.local/share/tts/tts_models/tts_models--multilingual--multi-dataset--xtts_v2/model.pth 
      --config_path /root/.local/share/tts/tts_models/tts_models--multilingual--multi-dataset--xtts_v2/config.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s 